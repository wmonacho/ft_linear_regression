[project]
name = "ft-linear-regression"
version = "0.1.0"
description = "Predict a car's price from its mileage with a linear regression trained by gradient descent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8, <4.0.0",
    "pandas>=3.0.1, <4.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1, <2.0.0",
    "pandas-stubs>=3.0.5, <4.0.0",
    "pytest>=9.0.2, <10.0.0",
    "pytest-cov>=7.0.0, <8.0.0",
    "ruff>=0.15.2, <1.0.0",
]
